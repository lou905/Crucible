<title>Proctor's Name</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Spectral:ital,wght@0,400;0,500;1,400&family=Courier+Prime&display=swap">
<style>
/* Layout: one candlelit column, a docket line over each scene, three meters nailed to the top. Single dark theme by choice: it is always night in Salem. */
:root{
  color-scheme: dark;
  --night:#121519;
  --panel:#1a1f25;
  --line:#2e353e;
  --tallow:#ece0bf;
  --dim:#a39b86;
  --ember:#e0a24a;
  --blood:#c2443a;
  --moss:#8fae82;
  --fear:0.3;
  --f-display:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-caps:"IM Fell English SC", "IM Fell English", Georgia, serif;
  --f-body:"Spectral", "Iowan Old Style", Georgia, serif;
  --f-record:"Courier Prime", "Courier New", ui-monospace, monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--night);color:var(--tallow);font-family:var(--f-body);font-size:17px;line-height:1.65;padding-inline:16px;padding-block:0 48px;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 40%, transparent 35%, var(--blood) 140%);
  opacity:calc(var(--fear) * 0.9);transition:opacity 1.2s ease}
body::after{content:"";position:fixed;left:50%;top:-30vh;width:120vw;height:80vh;transform:translateX(-50%);pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at center, color-mix(in srgb, var(--ember) 16%, transparent), transparent 60%);
  animation:flicker 5s infinite ease-in-out}
@keyframes flicker{0%,100%{opacity:.8}40%{opacity:.6}55%{opacity:.9}70%{opacity:.7}}
@media (prefers-reduced-motion: reduce){body::after{animation:none}*{transition:none!important}}
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto}

header{display:flex;flex-direction:column;gap:14px;padding-block:22px 18px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-caps);font-size:20px;letter-spacing:.04em;color:var(--ember);background:none;border:0;padding:0;cursor:pointer}
.acts{display:flex;gap:6px;font-family:var(--f-caps);font-size:14px;color:var(--dim)}
.acts span{padding:1px 8px;border:1px solid var(--line);border-radius:2px}
.acts span.on{color:var(--night);background:var(--ember);border-color:var(--ember)}
.acts span.done{color:var(--tallow)}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.meter label{display:flex;justify-content:space-between;font-family:var(--f-record);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.meter b{font-weight:400;color:var(--tallow);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);margin-top:5px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;transition:width .8s ease}
.m-name i{background:var(--ember)} .m-con i{background:var(--moss)} .m-fear i{background:var(--blood)}
.delta{font-style:normal;margin-left:4px;opacity:0;transition:opacity .3s}
.delta.show{opacity:1}
.delta.up{color:var(--moss)} .delta.down{color:var(--blood)}
.m-fear .delta.up{color:var(--blood)} .m-fear .delta.down{color:var(--moss)}

main{padding-block:28px 0}
.docket{font-family:var(--f-record);font-size:13px;color:var(--dim);letter-spacing:.04em;display:flex;flex-wrap:wrap;gap:4px 14px}
.docket span:first-child{color:var(--ember)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,7vw,46px);line-height:1.1;margin:10px 0 18px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 8px}
.prose{display:flex;flex-direction:column;gap:14px;max-width:62ch}
.prose p{margin:0}
.prose .aside{font-style:italic;color:var(--dim)}
.scene{animation:rise .6s ease both}
@keyframes rise{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}

.choices{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.choice{font:inherit;font-size:16px;line-height:1.5;color:var(--tallow);text-align:left;background:var(--panel);border:1px solid var(--line);padding:14px 16px 14px 44px;cursor:pointer;position:relative;transition:border-color .2s, background .2s}
.choice::before{content:attr(data-k);position:absolute;left:16px;top:13px;font-family:var(--f-caps);color:var(--ember)}
.choice:hover{border-color:var(--ember);background:color-mix(in srgb, var(--panel) 85%, var(--ember))}
.choice:focus-visible,.btn:focus-visible,.brand:focus-visible,summary:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

details.record{margin-top:30px;border-top:1px dashed var(--line);padding-top:14px}
summary{cursor:pointer;font-family:var(--f-record);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ ";color:var(--ember)}
details[open] summary::before{content:"\2212 "}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:14px}
.col h3{font-family:var(--f-caps);font-weight:400;font-size:16px;margin:0 0 6px;color:var(--ember)}
.col p{margin:0;font-family:var(--f-record);font-size:14px;line-height:1.55;color:var(--tallow)}
@media (max-width:560px){.cols{grid-template-columns:1fr}.meters{gap:10px}}

.title-card{padding-block:30px 10px}
.title-card h1{font-size:clamp(44px,12vw,76px);margin:6px 0 6px}
.kicker{font-family:var(--f-record);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ember)}
.sub{font-family:var(--f-display);font-style:italic;font-size:21px;color:var(--dim);margin:0 0 24px}
.legend{display:grid;gap:10px;margin:22px 0 4px;padding:16px;border:1px solid var(--line);background:var(--panel)}
.legend div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;font-size:15px}
.legend dt{font-family:var(--f-record);font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding-top:3px}
.legend dd{margin:0}
.toprt{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.snd{font-family:var(--f-record);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);background:transparent;border:1px solid var(--line);padding:4px 10px;cursor:pointer}
.snd[aria-pressed="true"]{border-color:var(--ember);color:var(--ember)}
.snd:focus-visible,.hs:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.art{position:relative;width:100%;max-width:100%;aspect-ratio:16/7;border:1px solid var(--line);background:#0b0d10;overflow:hidden;margin-bottom:18px}
.art canvas{display:block;width:100%;height:100%}
.hs{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:0;background:transparent;cursor:pointer;padding:0}
.hs::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--ember);box-shadow:0 0 12px var(--ember)}
.hs::after{content:"";position:absolute;inset:5px;border-radius:50%;border:1.5px solid var(--ember);animation:ping 2.2s infinite ease-out}
.hs.seen::before{background:var(--dim);box-shadow:none}.hs.seen::after{animation:none;opacity:.35}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.hint{position:absolute;right:8px;bottom:6px;font-family:var(--f-record);font-size:11px;color:var(--tallow);background:rgba(0,0,0,.5);padding:2px 6px;pointer-events:none}
.exhibit{border:1px solid var(--line);border-left:3px solid var(--ember);background:var(--panel);padding:12px 14px;margin:-6px 0 18px;display:grid;gap:4px;animation:rise .35s ease both}
.exhibit h3{font-family:var(--f-caps);font-weight:400;font-size:17px;margin:0;color:var(--ember);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.exhibit p{margin:0;font-size:15px;line-height:1.55}
.exhibit button{font-family:var(--f-record);font-size:12px;background:none;border:0;color:var(--dim);cursor:pointer}
.prose p{animation:rise .55s ease both;animation-delay:calc(var(--i,0) * .22s)}
.choices .choice{animation:rise .5s ease both;animation-delay:calc(var(--d,0) * 1s)}
.pick svg{width:52px;height:52px;color:var(--ember)}
@media (prefers-reduced-motion: reduce){.prose p,.choices .choice,.hs::after,.exhibit{animation:none}}
.cast{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:26px}
.pick{font:inherit;text-align:left;color:var(--tallow);background:var(--panel);border:1px solid var(--line);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .2s, background .2s}
.pick:hover{border-color:var(--ember);background:color-mix(in srgb, var(--panel) 85%, var(--ember))}
.pick:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.pick .role{font-family:var(--f-record);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ember)}
.pick .who{font-family:var(--f-display);font-size:24px;line-height:1.15}
.pick .blurb{font-size:14.5px;line-height:1.5;color:var(--dim);flex:1}
.pick .count{font-family:var(--f-record);font-size:12px;color:var(--dim);border-top:1px solid var(--line);padding-top:8px}
@media (max-width:620px){.cast{grid-template-columns:1fr}}
.found{font-family:var(--f-record);font-size:13px;color:var(--dim);margin-top:16px}
.btn{font-family:var(--f-caps);font-size:18px;background:var(--ember);color:var(--night);border:0;padding:12px 22px;cursor:pointer;margin-top:22px}
.btn.ghost{background:transparent;color:var(--tallow);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px}

.ending .seal{font-family:var(--f-record);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--blood)}
.verdict{margin-top:24px;padding:16px;border-left:3px solid var(--ember);background:var(--panel);font-style:italic}
.block{margin-top:30px}
.block ol,.block ul{margin:8px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.path li{font-size:15px}
.path li span{font-family:var(--f-record);font-size:12px;color:var(--dim);margin-right:6px}
.after p{font-family:var(--f-record);font-size:14px;line-height:1.6;margin:8px 0 0}
textarea#copybox{width:100%;min-height:120px;margin-top:10px;background:var(--panel);color:var(--tallow);border:1px solid var(--line);font-family:var(--f-record);font-size:13px;padding:10px}
.note{font-family:var(--f-record);font-size:13px;color:var(--moss);min-height:1.2em;margin-top:8px}
</style>

<div class="wrap">
  <header id="hud" hidden>
    <div class="top">
      <button class="brand" id="home" type="button" title="Back to title">Proctor’s Name</button>
      <div class="toprt"><div class="acts" id="acts"></div><button class="snd" id="hudsnd" type="button" aria-pressed="false">Music off</button></div>
    </div>
    <div class="meters">
      <div class="meter m-name"><label>Name <b><span id="v-name"></span><i class="delta" id="d-name"></i></b></label><div class="bar"><i id="b-name"></i></div></div>
      <div class="meter m-con"><label>Conscience <b><span id="v-con"></span><i class="delta" id="d-con"></i></b></label><div class="bar"><i id="b-con"></i></div></div>
      <div class="meter m-fear"><label>Salem’s Fear <b><span id="v-fear"></span><i class="delta" id="d-fear"></i></b></label><div class="bar"><i id="b-fear"></i></div></div>
    </div>
  </header>
  <main id="stage"></main>
</div>

<script>
const CHARS = {
  proctor:{name:"John Proctor", start:"a1_open", m:[70,50,30], role:"The farmer", blurb:"Your wife is accused, and the girl who accused her is someone you once betrayed her with. Protect your name or your conscience.", ends:["e_name","e_live","e_broken","e_silent","e_flight","e_early"]},
  mary:{name:"Mary Warren", start:"m1_woods", m:[30,50,30], role:"The servant", blurb:"For the first time in your life, people listen to you. Telling the truth could cost you everything Abigail has given you.", ends:["e_m_truth","e_m_jailturn","e_m_late","e_m_accuser"]},
  hale:{name:"Reverend Hale", start:"h1_arrive", m:[80,55,30], role:"The expert", blurb:"You came to Salem to find the Devil. Now you have to decide what to do when you realize the court you helped build is killing innocent people.", ends:["e_h_inside","e_h_counsel","e_h_witness","e_h_book"]}
};
const ACTS = ["I","II","III","IV"];

const S = {
/* ---------------- ACT I ---------------- */
a1_open:{act:1, place:"Rev. Parris’s house, Salem Village", when:"Spring 1692", title:"The Girl Who Will Not Wake",
 body:s=>[
  "Word reached your fields at dawn: the minister’s daughter, Betty Parris, will not wake up. By the time you get to the house, neighbors crowd the stairs and the word nobody wants to say first is already moving through the room. Witchcraft.",
  "Upstairs, Betty lies still with her eyes shut. When the others go down, Abigail Williams steps close. She is Parris’s niece. She used to work in your house, until your wife learned what happened between you and sent her away.",
  "Abigail says Betty is only frightened. The girls were dancing in the woods at night, Parris caught them, and that is the whole story. Then she lowers her voice. She has not forgotten you, she says, and she does not believe you have forgotten her."
 ],
 choices:[
  {t:"Tell her plainly it is finished. You will never touch her again.", fx:{con:10}, set:"coldAbby", go:"a1_hale"},
  {t:"Say nothing clear. Let her keep hoping, so she stays calm.", fx:{con:-10}, set:"softAbby", go:"a1_hale"},
  {t:"Warn her you will tell the village about the dancing if she does not let this go.", fx:{fear:5}, set:"threatened", go:"a1_hale"}
 ],
 record:{play:"Abigail is 17, an orphan and Proctor’s former servant. She and John had an affair while she worked in his house, and Elizabeth dismissed her.",
  history:"Abigail Williams was about 11 years old and John Proctor about 60. There is no record of any affair. Miller invented it and raised Abigail’s age to give the story a personal motive. Betty Parris was 9. The girls’ fits began in January and February of 1692."}},

a1_hale:{act:1, place:"Rev. Parris’s house, Salem Village", when:"The same afternoon", title:"The Expert Arrives",
 body:s=>[
  "Reverend John Hale rides in from Beverly with a stack of heavy books on the invisible world. He is sure, cheerful, and eager to work. Within the hour he is questioning Tituba, the woman enslaved in the Parris household.",
  "Pressed from every side, Tituba gives them what they want. Yes, the Devil came to her. Yes, there were others with him. She names women of the village. The girls feel the room shift, and they begin calling out names too, one after another, louder each time.",
  s.f.threatened ? "Abigail catches your eye as she cries out a name. She is showing you what she can do." : "Parris looks relieved. The blame is moving away from his house.",
 ],
 choices:[
  {t:"Stand up and say it: these are frightened children, and the town should send them home.", fx:{name:-5,con:10,fear:-10}, set:"spokeUp", go:"a2_home"},
  {t:"Walk out. You have planting to do, and this is the minister’s mess.", fx:{con:-5,fear:10}, go:"a2_home"},
  {t:"Tell the whole room why Abigail has reason to lie: you and she were together last year.", fx:{name:-30,con:15,fear:-10}, go:"a1_confess"}
 ],
 record:{play:"Hale arrives as a confident expert. Tituba confesses under pressure, and the girls start naming names in the same scene.",
  history:"Tituba was real. She was enslaved in the Parris household and is usually described as an Indigenous woman from the Caribbean. She confessed on March 1, 1692, and later said Parris beat her to make her confess. Her vivid story convinced many people. She was never executed. John Hale was also real. Years later he wrote a book admitting the court had made serious mistakes."}},

a1_confess:{act:1, place:"Rev. Parris’s house, Salem Village", when:"The same afternoon", title:"The Truth, Too Early",
 body:s=>[
  "The room goes silent. Before you finish, your wife’s name is already being whispered on the stairs.",
  "Parris turns red. Is a farmer who skips church now calling his niece a harlot to cover his own sin? Abigail cries out and falls, saying your spirit is pinching her arms.",
  "But some of the women are watching her differently now. Rebecca Nurse, old and widely respected, says quietly that a girl with a grudge like that should not be trusted with anyone’s life."
 ],
 choices:[
  {t:"Ride home and tell Elizabeth yourself before the gossip reaches her.", fx:{con:10}, set:"toldElizabeth", go:"e_early"},
  {t:"Stay and demand that Abigail be questioned under oath.", fx:{name:-5,fear:-5}, go:"e_early"}
 ],
 record:{play:"Proctor does not reveal the affair until Act III, in court, when it is too late to help.",
  history:"Rebecca Nurse was real. She was 71, a church member with a good reputation, and she was accused in March 1692. Her case shocked the village, because if Rebecca could be a witch, anyone could."}},

/* ---------------- ACT II ---------------- */
a2_home:{act:2, place:"The Proctor farm, Salem Farms", when:"Eight days later", title:"A Cold House",
 body:s=>[
  "You come in from planting at dusk. Elizabeth sets supper in front of you and says very little. It has been months since she learned about Abigail, and the house still feels cold.",
  s.f.coldAbby ? "You did end it, at Parris’s house. You want her to know that. You are not sure she would believe you." : (s.f.softAbby ? "You think about the hope you left Abigail with, and you do not mention it." : "You do not mention Parris’s house at all."),
  "Then Mary Warren, your servant, comes home from Salem, where she now sits with the court as an official witness. She hands Elizabeth a small rag doll she sewed in the courtroom. Thirty-nine people are in jail, she says. Goody Osburn will hang.",
  "Then, shaking, she adds one more thing. Elizabeth’s name came up in court today.",
  "Elizabeth looks at you. Go to Salem, she says. Tell them Abigail told you it was all sport."
 ],
 choices:[
  {t:"Promise to go tomorrow and tell the court what Abigail said.", fx:{con:10}, set:"promised", go:"a2_hale"},
  {t:"Hesitate. You were alone with Abigail when she said it. Who would believe you, and how would it look?", fx:{con:-10}, set:"hesitated", go:"a2_hale"},
  {t:"Forbid Mary Warren to go back to that court.", fx:{name:-5,fear:-5}, set:"forbade", go:"a2_hale"}
 ],
 record:{play:"Mary Warren is a timid 17-year-old servant who becomes important as a court witness. Goody Osburn is condemned to hang.",
  history:"Mary Warren was about 20 and really was the Proctors’ servant. She briefly said the accusers were lying, was then accused herself, and rejoined the accusers. Proctor reportedly said he would beat the fits out of her. Sarah Osburn was one of the first three accused, but she was never hanged. She died in jail in May 1692."}},

a2_hale:{act:2, place:"The Proctor farm, Salem Farms", when:"That night", title:"The Warrant",
 body:s=>[
  s.f.forbade ? "Mary Warren refuses to obey you. She saved Elizabeth’s life in court today, she says, by speaking up for her. She is an official now, and she will go where she likes." : "Before you can say more, there is a knock at the door.",
  "Reverend Hale has come after dark. He is visiting every house whose name has come up in court. He asks why you miss church so often and why your youngest son is not baptized. You tell him you have no respect for a minister who preaches hellfire and argues over golden candlesticks.",
  "Then he asks you to recite the Ten Commandments. You get through nine and stall. Elizabeth quietly supplies the last one: adultery.",
  "Horses in the yard. Ezekiel Cheever, clerk of the court, has a warrant for Elizabeth. He picks up Mary’s rag doll and finds a needle in its belly. Tonight at supper, he says, Abigail fell screaming with a needle stuck in her stomach. She says Elizabeth’s spirit put it there."
 ],
 choices:[
  {t:"Tear up the warrant and order them off your land.", fx:{name:-10,con:5,fear:5}, set:"tore", go:"a2_vow"},
  {t:"Let her go quietly and demand that everything be done by law.", fx:{name:5,con:-5}, go:"a2_vow"},
  {t:"Hold them at the door while Elizabeth takes the children and runs.", fx:{name:-20,fear:10}, go:"a2_flee"}
 ],
 record:{play:"Hale tests Proctor with the Ten Commandments. The needle in the poppet becomes evidence against Elizabeth, and she is arrested.",
  history:"The Ten Commandments test is Miller’s invention, but tests like it were real. People believed a witch could not recite the Lord’s Prayer perfectly. Minister George Burroughs recited it flawlessly on the gallows, which shook the crowd, but he was hanged anyway. Dolls called poppets were used as evidence in real cases, and Ezekiel Cheever was a real court clerk."}},

a2_flee:{act:2, place:"The Boston road", when:"Before dawn", title:"Run",
 body:s=>[
  "You put your shoulder into the door while Elizabeth gets the boys into the cart. Cheever goes down in the mud, and the marshal’s lantern breaks. By first light you are on the road to Boston, and everyone in Salem knows you resisted the court.",
  "A friend in Boston has heard of others doing the same. There is a governor in New York who will not send accused people back to Massachusetts. It is a long road, and you cannot go home again until this ends, if it ends."
 ],
 choices:[{t:"Look back once at the farm. Then keep driving.", go:"e_flight"}],
 record:{play:"No one in the play escapes. Every character stays and faces the court.",
  history:"Some people did run. Philip English, a wealthy Salem merchant, and his wife Mary escaped and fled to New York, where they stayed until the trials ended. John Alden, a ship captain, escaped from a Boston jail. Running saved lives, but it took money, friends, and luck."}},

a2_vow:{act:2, place:"The Proctor farm, Salem Farms", when:"That night", title:"Mary Warren",
 body:s=>[
  s.f.tore ? "The torn warrant changes nothing. They chain Elizabeth in the cart anyway, and now the court has one more mark against your name." : "They chain Elizabeth in the cart. She asks you to tell the boys she will be back soon.",
  "When the horses are gone, you turn on Mary Warren. The doll is hers, and she knows it. She saw Abigail put the needle in it, didn’t she?",
  "Mary is crying. She cannot speak against Abigail, she says. Abigail will kill her. And Abigail will charge you with lechery if you try this.",
  s.f.promised ? "You promised Elizabeth yesterday. It is time to keep that promise." : "You know what Elizabeth asked you to do. You did not do it then."
 ],
 choices:[
  {t:"Drag Mary to court tomorrow. She will tell the truth, whatever it costs.", fx:{con:10}, go:"a3_court"},
  {t:"Wait a few days and hope the court sorts this out by itself.", fx:{con:-10,fear:10}, set:"waited", go:"a3_court"}
 ],
 record:{play:"Proctor forces Mary to agree to testify, knowing it may expose his affair. He ends the act alone, sensing a storm coming.",
  history:"Accusers who tried to take it back were in real danger. When Mary Warren said the girls were lying, the others accused her of witchcraft. In jail, under questioning, she returned to the accusers’ side and named John Proctor."}},

/* ---------------- ACT III ---------------- */
a3_court:{act:3, place:"The meetinghouse, Salem", when:"Court in session", title:"Deputy Governor Danforth",
 body:s=>[
  s.f.waited ? "By the time you arrive, Elizabeth has been in jail for a week, and the court is used to her name." : "You arrive with Mary Warren holding your arm so she cannot run.",
  "Deputy Governor Danforth runs this court. He is calm and very sure of himself. Old Giles Corey has just been thrown out for shouting that Thomas Putnam is using the girls to grab his neighbors’ land.",
  "You hand Danforth Mary’s sworn statement: the girls are pretending. Danforth studies you for a long time. Then he tells you something you did not know. Elizabeth says she is carrying a child. If that is true, she will not hang for at least a year.",
  "Now, he asks. Will you drop your charge?"
 ],
 choices:[
  {t:"Refuse. Rebecca Nurse and Martha Corey have no baby to save them.", fx:{con:10}, go:"a3_giles"},
  {t:"Accept. Your wife and child will live. Take Mary home.", fx:{con:-15,fear:5}, go:"e_silent"}
 ],
 record:{play:"Danforth leads the court, and Elizabeth’s pregnancy is offered as a reason for Proctor to back down.",
  history:"Elizabeth Proctor really was pregnant, and that delayed her execution. But Thomas Danforth, the real deputy governor, did not sit on this court. The chief judge was William Stoughton. Miller combined several officials into one character. Judge John Hathorne was real; his descendant, the writer Nathaniel Hawthorne, added a W to the family name."}},

a3_giles:{act:3, place:"The meetinghouse, Salem", when:"Court in session", title:"Ninety-One Names",
 body:s=>[
  "You hand over a paper signed by ninety-one neighbors swearing that Rebecca, Martha, and Elizabeth are good women. Danforth reads it and orders warrants for every signer, so they can be questioned.",
  "Giles Corey is back, and Danforth wants the name of the man who told him about Putnam’s land scheme. Giles will not give it. He says he will not hand a neighbor over to be hanged. Danforth begins writing out a charge of contempt.",
  "Giles looks at you."
 ],
 choices:[
  {t:"Back him. An honest man does not hand his neighbors to this court.", fx:{con:5,name:-5,fear:5}, set:"backedGiles", go:"a3_girls"},
  {t:"Urge him to give the name and save himself.", fx:{con:-5,name:5}, go:"a3_girls"}
 ],
 record:{play:"The court treats the petition itself as suspicious. Giles is arrested for refusing to name his source.",
  history:"Real petitions were signed: 39 people signed for Rebecca Nurse, and 32 neighbors from Ipswich signed for the Proctors. The signers were not arrested. Giles Corey was real, too. He refused to enter a plea, so he was pressed under heavy stones until he died on September 19, 1692. He is the only person in American history executed that way."}},

a3_girls:{act:3, place:"The meetinghouse, Salem", when:"Court in session", title:"Cold Wind",
 body:s=>[
  "The girls are brought in. Danforth asks Mary to faint, right here, the way she did when she was accusing people. She tries. She cannot.",
  "Abigail goes very still. Is Mary calling her a liar? Then she shivers. A cold wind, she says, is coming off Mary Warren. One by one the other girls shiver and hug themselves and stare at Mary.",
  "You watch Danforth begin to doubt Mary instead of Abigail. There is one way left to break Abigail’s hold on this room, and it will cost you everything people think of you."
 ],
 choices:[
  {t:"Tell the court everything: you and Abigail. She wants Elizabeth dead so she can take her place.", fx:{name:-30,con:15,fear:-5}, set:"confessedCourt", go:"a3_lie"},
  {t:"Call Abigail a liar, but keep your own secret.", fx:{con:-10,fear:10}, go:"a3_bird"}
 ],
 record:{play:"Proctor confesses to adultery in open court to prove Abigail has a motive.",
  history:"There was no affair to confess. In 1692, the real John Proctor’s defense was that the accusers were lying and that the court was using cruel methods to get confessions."}},

a3_lie:{act:3, place:"The meetinghouse, Salem", when:"Court in session", title:"The Only Lie",
 body:s=>[
  "Danforth sends for Elizabeth. You have said she never lies, so he will ask her. He orders you to turn your back so you cannot signal her.",
  "Is her husband a lecher? Elizabeth looks for your face and cannot see it. She does not know you have already told them. She thinks of your name, and she says no.",
  "Danforth has his answer. Hale begs him to listen, says he believes you, but the door has closed. Elizabeth is led out, and you understand what she tried to do for you."
 ],
 choices:[{t:"Watch Abigail make her next move.", go:"a3_bird"}],
 record:{play:"Elizabeth, who prides herself on honesty, lies to protect John, and the lie destroys his case.",
  history:"This moment is invented. It shows one of the play’s key ideas: in a court built on fear, even an honest act can be turned into evidence against you."}},

a3_bird:{act:3, place:"The meetinghouse, Salem", when:"Court in session", title:"The Yellow Bird",
 body:s=>[
  "Abigail stares up at the rafters and screams. There is a yellow bird up there, she says, and it is Mary’s spirit coming to tear her face. The girls repeat every word Mary says, the instant she says it, until Mary is screaming at them to stop.",
  "Then Mary breaks. She turns and points at you. You are the Devil’s man, she cries. You came to her at night and made her sign.",
  "Danforth asks if you have joined with the Devil. Across the room, Reverend Hale stands up, says he is finished with this court, and walks out the door."
 ],
 choices:[
  {t:"Tell them God sees this room, and every person in it will answer for what was done here.", fx:{con:10,name:-5,fear:5}, go:"a4_cell"},
  {t:"Say nothing. Hold out your wrists.", go:"a4_cell"}
 ],
 record:{play:"The girls’ performance turns Mary against Proctor, and he is arrested. Hale quits the court.",
  history:"The real trials leaned on spectral evidence: testimony that a person’s spirit had attacked someone, which the accused had no way to disprove. In October 1692, minister Increase Mather argued it would be better for ten suspected witches to go free than for one innocent person to die. On October 29, Governor Phips shut down the court."}},

/* ---------------- ACT IV ---------------- */
a4_cell:{act:4, place:"Salem jail", when:"Autumn 1692, before dawn", title:"Three Months in Chains",
 body:s=>[
  "You have been in the jail since summer. Your beard is long and your wrists are raw.",
  "Reverend Hale has come back, thin and worn. He is doing the Devil’s work now, he says: begging the condemned to lie and confess so they can live. Parris is shaken too. Abigail has vanished, and his money box went with her. People in Andover have turned against the court. Parris is afraid of what the town will do when good people hang.",
  "The hangings are at sunrise. Danforth lets you speak with Elizabeth alone."
 ],
 choices:[
  {t:"Ask Elizabeth what she thinks you should do.", set:"askedEliz", go:"a4_eliz"},
  {t:"Don’t ask her. She has carried enough of your choices.", go:"a4_eliz"}
 ],
 record:{play:"Act IV takes place in the fall, as the hangings continue and the town starts to turn against the court.",
  history:"Andover had more accused people than any other town, and by the fall many people there were pushing back against the accusations. There is no record of the real Abigail Williams stealing money and running away; that is another of Miller’s inventions."}},

a4_eliz:{act:4, place:"Salem jail", when:"Before dawn", title:"Elizabeth",
 body:s=>[
  s.f.askedEliz ? "She will not choose for you, she says. It is your life and your soul, and she will not weigh them for you." : "She speaks first anyway. Whatever you decide, she says, it has to be yours.",
  "Then she tells you something she has been holding for months. She kept a cold house. She never believed someone like you could truly love someone as plain as her, and that doubt let the coldness in. Your sin was yours, but part of the winter was hers.",
  "Giles Corey is dead, she tells you. They pressed him under stones for two days. He never gave them an answer.",
  "Danforth is at the door with paper and ink."
 ],
 choices:[
  {t:"Refuse. You will not confess to something you did not do.", go:"e_martyr"},
  {t:"Confess out loud, but refuse to name anyone else.", fx:{con:-10,name:5}, go:"a4_paper"},
  {t:"Confess, sign, and let them post it. You want to see your child born.", fx:{con:-20,name:-5,fear:5}, go:"e_live"}
 ],
 record:{play:"Elizabeth forgives John and takes some blame for the coldness in their marriage. She refuses to decide for him.",
  history:"The real Elizabeth survived. Her son was born in January 1693, and she was released after the trials ended. Because John had been condemned, his estate was taken, and Elizabeth had to fight to get her share of the family property."}},

a4_paper:{act:4, place:"Salem jail", when:"Sunrise", title:"The Paper",
 body:s=>[
  "Danforth has the clerk write it all down. Then he starts reading names. Did you see Rebecca Nurse with the Devil? Martha Corey? You say you saw no one. You speak only for yourself.",
  "Danforth lets that go. But he needs your signature. The confession will be posted on the church door, so the whole village knows John Proctor confessed.",
  "You sign. He reaches for the paper. Your hand is still on it."
 ],
 choices:[
  {t:"Tear it in half. They can have the lie, but not your name on a church door.", fx:{con:25,name:10}, go:"e_name"},
  {t:"Let him take it.", fx:{con:-10}, go:"e_live"},
  {t:"Give them Rebecca and Martha too, if that is what it takes to go home.", fx:{con:-30,fear:15}, go:"e_broken"}
 ],
 record:{play:"Proctor signs but will not hand over the paper. He says the signature is his name, and he cannot live without it. He tears it up and goes to the gallows.",
  history:"Officials really did push people who confessed to name others. Signed confessions were used as evidence in court and helped the accusations spread to new towns."}},

e_martyr:{alias:"e_name"},

/* ---------------- ENDINGS ---------------- */
e_name:{act:4, ending:true, title:"The Name You Kept", seal:"Ending: Miller’s ending",
 body:s=>[
  "You walk out into the gray morning beside Rebecca Nurse. She is calm, and so, to your surprise, are you.",
  "Behind you, Hale begs Elizabeth to go after you and change your mind. She will not. You have found your goodness at last, she tells him, and she will not take it from you.",
  "The drums start. The sun comes up over Salem."
 ],
 record:"The real John Proctor never confessed. He was hanged on August 19, 1692, with George Burroughs, George Jacobs Sr., John Willard, and Martha Carrier. From jail he wrote to ministers in Boston, describing how accused people were tortured and asking for a fair trial. Rebecca Nurse was hanged a month earlier, on July 19.",
 questions:["In the play, Proctor will say a false confession but will not let his signed name be posted. Why does a public, signed name matter so much to him?","Elizabeth refuses to stop him. Is that love, or something else?"]},

e_live:{act:4, ending:true, title:"The Living Man", seal:"Ending: you confessed",
 body:s=>[
  "You walk out of the jail alive. By noon your confession is nailed to the meetinghouse door, and by evening the whole village has read it.",
  "Rebecca Nurse hangs that morning without you. Some neighbors stop speaking to you. Others nod at you on the road, because they confessed too.",
  "In the winter, your child is born. You hold the baby and try not to think about the paper on the door."
 ],
 record:"This is the strangest truth of 1692: no one who confessed was executed. About fifty people confessed, and the court kept them alive as witnesses. The people who died were the ones who insisted they were innocent. Later, many who confessed, including a group of women from Andover, said they lied because they were terrified.",
 questions:["In 1692, lying saved your life and telling the truth could get you killed. What does a system like that do to the people inside it?","Would you judge this John Proctor more harshly than the one in Miller’s play? Why?"]},

e_broken:{act:4, ending:true, title:"The Names You Gave", seal:"Ending: you named others",
 body:s=>[
  "You give them Rebecca. You give them Martha. Danforth’s clerk writes quickly.",
  "You go home. Within a week, the marshal is riding to three more farms, and your confession is being read aloud as evidence against them.",
  "Elizabeth gives birth in the winter. She does not ask what you said in that room, and you do not tell her."
 ],
 record:"Naming others is how the panic spread. People who confessed were pressured to describe the witch meetings they had supposedly attended and say who else was there. Each confession produced new names, and each name produced new arrests. By the end, between 150 and 200 people had been accused in about two dozen towns.",
 questions:["Danforth needed names more than he needed confessions. Why would a court like this one depend on accused people accusing others?","Where do you see this pattern, where pressure on one person spreads blame to many, in groups today?"]},

e_silent:{act:3, ending:true, title:"The Quiet Farmer", seal:"Ending: you dropped the charge",
 body:s=>[
  "You take Mary Warren home. Elizabeth stays in jail until her child is born, and then the court is gone, and she comes home too.",
  "Rebecca Nurse hangs in July. Giles Corey dies under the stones in September. Martha Corey hangs three days after her husband.",
  "You never speak about the court again. When neighbors bring it up, you go out to the fields."
 ],
 record:"Most people in 1692 did what this John Proctor did: they kept their heads down. Few spoke out publicly while the court was running. One who did was Thomas Brattle, a Boston merchant, who wrote a sharp letter in October 1692 criticizing the trials. Martha Corey really was hanged on September 22, three days after Giles died.",
 questions:["You saved your family and let others die. Was it the wrong choice, or just a human one?","Miller wrote this play in 1953, when many Americans stayed silent while neighbors were accused of being Communists. Why might silence be the most common response to a panic?"]},

e_flight:{act:2, ending:true, title:"The Road to New York", seal:"Ending: you fled",
 body:s=>[
  "You reach New York by midsummer. Elizabeth gives birth in a rented room above a cooper’s shop. Letters from Salem come slowly, and each one carries more names.",
  "Mary Warren, you hear, went back to the accusers. Rebecca Nurse is dead. Someone else is farming your land.",
  "When the court finally closes, you think about going home. You are not sure there is a home to go back to."
 ],
 record:"Philip and Mary English, a wealthy Salem couple, escaped and fled to New York, returning after the trials ended. When Philip came home, he found much of his property had been seized. Running was possible only for people with money and powerful friends, and it did nothing to stop the trials for everyone else.",
 questions:["Is running away from injustice a form of resisting it, or a way of avoiding it?","Who could afford to run in 1692, and who could not? What does that say about who was most at risk?"]},

e_early:{act:1, ending:true, title:"The Truth, Too Early", seal:"Ending: an alternate history",
 body:s=>[
  s.f.toldElizabeth ? "You ride home and tell Elizabeth before anyone else can. She does not speak to you for a week. On the eighth day, she sets a second plate at the table." : "By the time you get home, Elizabeth already knows. Half the village told her before you did.",
  "Your name is ruined in Salem Village. But Abigail’s is damaged too. When she cries out, people now remember why she might.",
  "It does not stop. Other girls keep naming people. The jails still fill. By summer, warrants are being written in towns you have never visited. One girl’s grudge started nothing on its own, and removing it ends nothing."
 ],
 record:"In 1692 there were many accusers, not one. The most active was Ann Putnam Jr., who accused dozens of people. In 1706 she stood up in church and publicly apologized, saying she had been deceived. Historians still argue about what caused the panic: fear of Native American attacks on the frontier, land disputes, a strict religious culture, illness, and plain fraud have all been suggested.",
 questions:["Miller built his whole story around Abigail’s grudge. Why might he have wanted a personal motive, when the real history was so much bigger?","If exposing one liar can’t stop a panic, what would?"]}
};

/* ---------------- MARY WARREN ---------------- */
Object.assign(S,{
m1_woods:{act:1, place:"Rev. Parris’s house, Salem Village", when:"Spring 1692", title:"Abigail’s Warning",
 body:s=>[
  "You are Mary Warren, seventeen, a servant in John Proctor’s house. You were not dancing in the woods. You only watched from the trees, or that is what you keep telling yourself. Mr. Proctor told you to stay home today. You came anyway, because the whole village is coming to see Betty Parris.",
  "Upstairs, Abigail pulls the girls close around Betty’s bed. Her voice is low and hard. They danced, she says, and that is all anyone will ever say. Any girl who says one word more will be sorry, and Abigail will make sure of it.",
  "Mercy Lewis nods. Betty whimpers. Abigail looks at you last."
 ],
 choices:[
  {t:"Nod and promise to keep quiet.", fx:{con:-5,fear:5}, go:"m1_names"},
  {t:"Say the girls should just tell the truth: it was dancing and nothing else.", fx:{name:-5,con:10}, set:"defied", go:"m1_names"}
 ],
 record:{play:"Mary Warren is a frightened 17-year-old servant. Abigail threatens the girls to keep their stories straight.",
  history:"The real Mary Warren was about 20. She was not one of the first girls to have fits. Hers began in March 1692, after the accusations had already started."}},

m1_names:{act:1, place:"Rev. Parris’s house, Salem Village", when:"The same afternoon", title:"The Girls Who Are Listened To",
 body:s=>[
  "Reverend Hale arrives with his books. Before long Tituba is confessing and the girls are calling out names. Something strange happens in the room. The adults stop talking over the girls. They lean in. They write down every word.",
  s.f.defied ? "Abigail has not looked at you since you spoke up. Somehow that is worse than if she had." : "Abigail catches your eye and gives you the smallest nod.",
  "You have been a servant your whole life. Nobody has ever written down a word you said."
 ],
 choices:[
  {t:"Cry out a name of your own. For the first time, the room turns to you.", fx:{name:15,con:-15,fear:10}, set:"joined", go:"m2_court"},
  {t:"Stay at the back of the room and say nothing.", go:"m2_court"}
 ],
 record:{play:"Mary does not cry out in Act I, but by Act II she is an official of the court.",
  history:"The accusers were mostly girls and young women with very little power in Puritan society. Many historians point out that the trials gave them sudden attention and authority, which may help explain why the accusations kept coming."}},

m2_court:{act:2, place:"The meetinghouse, Salem", when:"A week later", title:"Goody Osburn",
 body:s=>[
  "You sit with the girls on the front bench now. People make room for you in the road. You are, as Abigail likes to say, an official of the court.",
  "Today the court examines Sarah Osburn, a poor old woman who once turned you away from her door, muttering something you could not hear. Now you remember that your stomach cramped that night. Abigail leans over and whispers that the old woman was cursing you. Didn’t you feel it?",
  "The judges are waiting. Everyone is looking at the bench."
 ],
 choices:[
  {t:"Testify that Goody Osburn sent her spirit to choke you.", fx:{name:10,con:-15,fear:10}, set:"testified", go:"m2_poppet"},
  {t:"Say you are not sure. Maybe you were only hungry.", fx:{name:-10,con:10,fear:-5}, go:"m2_poppet"}
 ],
 record:{play:"Mary tells the Proctors she only “remembered” Osburn cursing her once the court started asking. Osburn is condemned to hang.",
  history:"Sarah Osburn was one of the first three women accused, along with Tituba and Sarah Good. She was poor, sickly, and unpopular. She died in jail in May 1692 before any trial."}},

m2_poppet:{act:2, place:"The Proctor farm, Salem Farms", when:"That night", title:"The Poppet",
 body:s=>[
  "To pass the long hours in court, you sewed a little rag doll. Abigail sat beside you while you worked, and when she handed it back, she had stuck your needle in its belly to keep it safe.",
  "Tonight you give the doll to Goody Proctor as a gift. Mr. Proctor is furious that you went to court against his orders. You tell him you saved his wife’s life today. Her name came up, and you spoke for her.",
  "Then Cheever arrives with a warrant. He finds the needle. Abigail, he says, fell at supper with a needle in her stomach and named Elizabeth’s spirit.",
  "Everyone turns to you. It is your doll."
 ],
 choices:[
  {t:"Say it now: you made the doll, and Abigail sat beside you when the needle went in.", fx:{name:-10,con:15,fear:-5}, set:"toldNeedle", go:"m3_court"},
  {t:"Say only that you made the doll. Leave Abigail out of it.", fx:{con:-10}, go:"m3_court"}
 ],
 record:{play:"Mary admits the poppet is hers and that Abigail watched her put the needle in. It is not enough. Elizabeth is still arrested.",
  history:"Poppets, small dolls supposedly used to harm victims, were real evidence in 1692. Witnesses claimed poppets were found in the walls of Bridget Bishop’s old house, and that was used against her. She was the first person hanged, on June 10."}},

m3_court:{act:3, place:"The meetinghouse, Salem", when:"Court in session", title:"The Truth in Open Court",
 body:s=>[
  s.f.toldNeedle ? "What you said in the Proctors’ kitchen did not save Elizabeth. Mr. Proctor says this time you will say it under oath, in front of Danforth." : "Mr. Proctor marches you to Salem. You will tell them the girls are pretending, he says, or Elizabeth will hang.",
  "Deputy Governor Danforth reads your statement and turns cold. If you lied before, you lied under oath. Then he tells you to faint, right now, the way you did on the bench. You try. Without the girls and the crowd and the screaming, you cannot.",
  "Abigail stares at you. A cold wind is coming off you, she says. The girls shiver. Then they start repeating every word you say the moment you say it. Danforth is watching you, not them."
 ],
 choices:[
  {t:"Keep telling the truth, louder: they are pretending, and so were you.", fx:{name:-15,con:15,fear:5}, go:"m3_hold"},
  {t:"Break. Point at Mr. Proctor and say he made you do it.", fx:{name:15,con:-25,fear:15}, go:"m4_dawn"}
 ],
 record:{play:"Mary breaks, accuses Proctor of being the Devil’s man, and rejoins Abigail.",
  history:"In April 1692, the real Mary Warren told people the afflicted girls were faking. The girls quickly accused her of witchcraft, and she was arrested."}},

m3_hold:{act:3, place:"Salem jail", when:"Weeks later", title:"Arrested",
 body:s=>[
  "Danforth signs a warrant for you before sundown. The girls scream as you are led out, saying your spirit is biting them.",
  "Now you share a jail with Goody Proctor. The magistrates come to your cell again and again with the same questions. Did John Proctor make you sign the Devil’s book? Did he threaten you? Didn’t he beat you? If you would only tell them, they say, the girls’ pain would stop and you could go home.",
  "You are cold and hungry, and you have not slept in days."
 ],
 choices:[
  {t:"Keep saying the same thing: nobody made you do anything. The girls are lying.", fx:{name:-10,con:15}, go:"e_m_truth"},
  {t:"Give them what they want. Say Proctor forced you.", fx:{con:-25,fear:15}, go:"e_m_jailturn"}
 ],
 record:{play:"This scene is not in the play. Mary turns all at once, in the courtroom.",
  history:"This is close to what really happened. Mary Warren was jailed and questioned many times. Her story changed over several examinations, until she accused John and Elizabeth Proctor and returned to the accusers."}},

m4_dawn:{act:4, place:"Outside Salem jail", when:"Autumn 1692, before dawn", title:"Dawn",
 body:s=>[
  "Abigail is gone. She ran off in the night with her uncle’s money, and the girls whisper that she took a ship. Without her, the front bench feels small.",
  s.f.joined ? "You have cried out more names than you can count. You remember every one." : "",
  "Mr. Proctor hangs at sunrise, and he is there because of what you said in that courtroom. Goody Proctor will raise his child without him.",
  "The jail door is a few steps away. Danforth is inside."
 ],
 choices:[
  {t:"Go in and tell Danforth you lied about Mr. Proctor.", fx:{name:-20,con:20}, go:"e_m_late"},
  {t:"Walk home. It is too late to change anything now.", fx:{con:-10}, go:"e_m_accuser"}
 ],
 record:{play:"Mary does not appear in Act IV. Abigail runs away with Parris’s money.",
  history:"There is no record of the real Abigail Williams running away with money. Little is known about what happened to Mary Warren after 1692."}},

e_m_truth:{act:3, ending:true, title:"The Girl Who Kept Her Story", seal:"Ending: an alternate history",
 body:s=>[
  "You stay in jail through the summer and into the fall. The magistrates stop visiting. On hanging days you hear the carts go by.",
  "When the court is finally shut down, they let you out. Nobody in Salem knows what to say to you. Some think you are a witch who was never tried. A few, very quietly, thank you.",
  "After her baby is born, Elizabeth Proctor comes to see you. She sits with you a long time and says almost nothing, and that is enough."
 ],
 record:"This is not what happened. The real Mary Warren could not hold out. Some accused people did refuse to change their stories, and many of them paid with their lives. Holding to the truth in 1692 took a kind of courage very few people had.",
 questions:["What made it so hard for Mary to keep telling the truth? List every pressure on her.","Mary’s Conscience is high here, but she gains nothing else. Is this a happy ending?"]},

e_m_jailturn:{act:3, ending:true, title:"Back on the Bench", seal:"Ending: what really happened",
 body:s=>[
  "The magistrates write down every word. The next day you are back on the front bench with the girls, and your pains return whenever a Proctor enters the room.",
  "John Proctor hangs in August. You testify against others that summer. People make room for you in the road again.",
  "Some nights you say the truth out loud to the dark, just to hear it."
 ],
 record:"This is closest to the real history. After weeks in jail, Mary Warren returned to the accusers and testified against John and Elizabeth Proctor and others. Her statements were used in court. The pressure that broke her was the same pressure the court put on everyone: confess and accuse, or suffer.",
 questions:["Was Mary a villain, a victim, or both? Use evidence from the play.","Proctor demands that Mary be brave. Was it fair to ask a servant with no power to risk everything?"]},

e_m_late:{act:4, ending:true, title:"Too Late", seal:"Ending: you took it back",
 body:s=>[
  "Danforth listens without any expression. You lied before, he says. Why should he believe you now? He has the guard walk you out.",
  "Reverend Hale stops you at the door. He believes you, he says. He has believed it for months. It does not matter.",
  "The drums start. You stand in the crowd and make yourself watch."
 ],
 record:"Accusers who tried to take back their testimony in 1692 were rarely believed and were often accused themselves. Real apologies came years later. In 1706, Ann Putnam Jr., the most active accuser, stood up in church and admitted she had helped bring guilt on innocent people.",
 questions:["Why does Danforth reject Mary’s confession now, when he accepted her accusations so easily?","Is telling the truth too late still worth doing?"]},

e_m_accuser:{act:4, ending:true, title:"The Official", seal:"Ending: you stayed silent",
 body:s=>[
  "You walk home on the dusty road. Behind you, a crowd gathers at the edge of town.",
  "By winter the court is gone, and so is your place on the bench. You go into service with another family. Nobody makes room for you in the road anymore.",
  "At church, Elizabeth Proctor sits three rows ahead of you with her baby. She never turns around."
 ],
 record:"After the trials ended, most accusers went back to ordinary life, and almost none were ever punished. Their testimony was the main evidence that sent 19 people to the gallows.",
 questions:["Mary had power for a few months and then lost it. What did that power cost other people?","Where do you see people go along with a crowd because it gives them attention or protection?"]}
});

/* ---------------- REVEREND HALE ---------------- */
Object.assign(S,{
h1_arrive:{act:1, place:"Rev. Parris’s house, Salem Village", when:"Spring 1692", title:"The Expert",
 body:s=>[
  "You are Reverend John Hale, minister of Beverly. You ride into Salem Village with an armful of books, each one heavy with what learned men have written about the Devil and how he works.",
  "Reverend Parris greets you like a rescuer. Old Rebecca Nurse is less pleased. Hunting for spirits, she warns, is how a village tears itself apart. John Proctor watches you with his arms folded.",
  "Upstairs, Betty Parris lies still. Downstairs, Tituba waits in the kitchen. You know how to do this. You have studied for years."
 ],
 choices:[
  {t:"Go slowly. Examine Betty, ask careful questions, and insist on real evidence.", fx:{con:5}, set:"careful", go:"h1_tituba"},
  {t:"Press Tituba hard for names. The faster the Devil is found, the faster this ends.", fx:{name:10,con:-10,fear:15}, set:"pressed", go:"h1_tituba"}
 ],
 record:{play:"Hale is an earnest, bookish minister nearing forty who believes his learning holds the answers.",
  history:"The real John Hale was about 56 and the minister of Beverly. He took part in the early examinations in Salem Village and supported the trials at first. Rebecca Nurse was real too, and she was accused just weeks later."}},

h1_tituba:{act:1, place:"Rev. Parris’s house, Salem Village", when:"The same afternoon", title:"Names",
 body:s=>[
  s.f.pressed ? "You lean over Tituba and ask the same questions again and again. Who came with the Devil? Who else? Behind you, Parris says she will be whipped to death if she does not answer." : "You ask Tituba calm questions. But Parris stands behind her, red-faced, and says she will be whipped to death if she lies.",
  "She breaks. Yes, the Devil came to her. She names two women. Then Abigail cries out, Betty sits up in bed, and the girls are calling out names faster than Parris can write them down.",
  "Everyone looks at you. You are the expert. They are waiting for you to tell them what this means."
 ],
 choices:[
  {t:"Thank God out loud. The Devil is exposed, and you will send these names to the magistrates.", fx:{name:10,con:-5,fear:10}, go:"h2_proctor"},
  {t:"Tell them no one should be arrested on a frightened child’s word alone.", fx:{name:-10,con:10,fear:-10}, set:"cautious", go:"h2_proctor"}
 ],
 record:{play:"Hale leads Tituba’s questioning and welcomes the girls’ accusations as a breakthrough.",
  history:"Tituba confessed in early March 1692. She later said Parris beat her to force the confession. Her detailed story about the Devil and his followers made the panic feel real to the adults of Salem."}},

h2_proctor:{act:2, place:"The Proctor farm, Salem Farms", when:"Eight days later, after dark", title:"The Proctor House",
 body:s=>[
  "Rebecca Nurse’s name came up in court today, and it shook you. If a woman like that can be accused, you want to see the other names for yourself. So you ride out to the Proctor farm.",
  "John Proctor cannot name all Ten Commandments; his wife has to supply adultery. He admits he rarely goes to church because he cannot stand Parris. Then he says something that stops you cold. Abigail told him the sickness has nothing to do with witchcraft.",
  s.f.cautious ? "You think about what you said at Parris’s house about children’s words." : "",
  "Before you can answer, Cheever arrives with a warrant for Elizabeth and finds a needle in a rag doll."
 ],
 choices:[
  {t:"Tell Proctor to bring Abigail’s words to court, and promise to stand behind him.", fx:{name:-5,con:10}, set:"backed", go:"h3_court"},
  {t:"Assure them the court is just. If Elizabeth is innocent, she has nothing to fear.", fx:{name:5,con:-5,fear:5}, go:"h3_court"}
 ],
 record:{play:"Hale visits the Proctors on his own, tests their faith, and is troubled by what Proctor tells him. He still tells them to trust the court.",
  history:"Rebecca Nurse was arrested on March 24, 1692. Her arrest alarmed many people, because she was known as one of the most devout women in the village. A jury first found her not guilty. The judges asked the jury to reconsider, and she was convicted."}},

h3_court:{act:3, place:"The meetinghouse, Salem", when:"Court in session", title:"The Yellow Bird",
 body:s=>[
  s.f.backed ? "You keep your promise. When Proctor brings Mary Warren to court, you stand with him and ask Danforth to let a lawyer argue the case." : "You watch Proctor bring Mary Warren to court. Before you know it, you are asking Danforth to let a lawyer argue the case.",
  "Danforth refuses. Then Proctor confesses to adultery with Abigail, and Elizabeth, brought in to confirm it, says no. You believe Proctor anyway. Abigail has always struck you as false.",
  "Then Abigail screams at a yellow bird in the rafters, and Mary Warren breaks and points at Proctor. Danforth orders his arrest. Everything you started at Parris’s house is now aimed at innocent people."
 ],
 choices:[
  {t:"Stand up, denounce these proceedings, and walk out of the court.", fx:{name:-20,con:15}, go:"h4_jail"},
  {t:"Stay. If you leave, no one in this room will speak for reason.", fx:{name:10,con:-15,fear:10}, go:"e_h_inside"}
 ],
 record:{play:"Hale denounces the court and quits after Proctor is arrested.",
  history:"The real Hale did not quit in protest. He kept supporting the court for months. His doubts grew in the fall of 1692, and by many accounts that included the moment his own wife, Sarah Hale, was accused of witchcraft in October."}},

h4_jail:{act:4, place:"Salem jail", when:"Autumn 1692, before dawn", title:"Lie and Live",
 body:s=>[
  "You have come back to Salem to do a terrible thing. You go cell to cell, begging the condemned to confess to crimes they did not commit, because a lie is better than a hanging. You tell yourself this is mercy.",
  "Proctor is the last. He has been in chains for three months. Elizabeth is with him. Danforth waits outside with paper and ink.",
  "Proctor might listen to you. You are the one who brought the books to Salem."
 ],
 choices:[
  {t:"Beg him to confess. Life is God’s most precious gift, and no principle is worth his blood.", fx:{con:-5}, go:"e_h_counsel"},
  {t:"Tell him you were wrong to ask. Then walk beside him to the gallows.", fx:{name:-10,con:15}, go:"e_h_witness"},
  {t:"Ride for Boston tonight and press the governor to end spectral evidence before more people hang.", fx:{name:5,con:10,fear:-15}, go:"e_h_book"}
 ],
 record:{play:"Hale begs Proctor to confess and lives with his guilt as Proctor goes to his death.",
  history:"In October 1692, ministers including Increase Mather publicly argued against spectral evidence, and Governor Phips shut down the court on October 29. Hale later wrote a book about what went wrong."}},

e_h_inside:{act:3, ending:true, title:"The Man Who Stayed", seal:"Ending: you stayed on the court",
 body:s=>[
  "You keep your seat. Each day you raise a careful question, and each day Danforth answers it and the court moves on.",
  "In August you watch John Proctor hang. In September you watch eight more. Your questions sit in the record, neat and polite and useless.",
  "When the governor finally closes the court, people thank you for being a voice of reason. You do not know what to say."
 ],
 record:"This is closer to what the real Hale did than the play is. He stayed loyal to the court through most of 1692. Later he admitted that he and the other leaders had followed wrong rules, and that innocent people died because of it.",
 questions:["Can you change a broken system from the inside? When does staying turn into going along?","Why might Miller have made Hale quit in Act III when the real Hale did not?"]},

e_h_counsel:{act:4, ending:true, title:"Blood on the Books", seal:"Ending: Miller’s ending",
 body:s=>[
  "Proctor signs, then tears the paper in half. He will not let them post his name on the church door. He walks out toward the gallows.",
  "You beg Elizabeth to go after him. She will not. He has found his goodness at last, she tells you, and she will not take it from him.",
  "You stand in the gray morning with blood on your hands, and the drums begin."
 ],
 record:"The real Hale later wrote a book admitting the trials had gone badly wrong. He said the leaders followed rules handed down from earlier writers on witchcraft, and those rules led them astray. He finished it in 1697, and it was published in 1702, two years after his death.",
 questions:["Hale tells Proctor that life matters more than any principle. Is he right?","Hale changes more than any other character in the play. What does his story suggest about how hard it is for experts to admit they were wrong?"]},

e_h_witness:{act:4, ending:true, title:"Beside Him", seal:"Ending: an alternate history",
 body:s=>[
  "You tell Proctor you were wrong. You never should have asked any of them to lie. He looks at you a long time, then nods.",
  "You walk beside him to the hill. You pray with him and with Rebecca Nurse, and you do not look away.",
  "On Sunday you go home to Beverly and preach about false witness. Some of your congregation walk out."
 ],
 record:"Speaking against the court during the trials was dangerous, and ministers who doubted it mostly wrote private letters. On the gallows, George Burroughs, a former Salem Village minister, recited the Lord’s Prayer perfectly, which people believed a witch could not do. The crowd was shaken, but the hanging went ahead.",
 questions:["Hale cannot save Proctor here. What does it mean to stand with someone you cannot save?","Compare this ending with Miller’s. Which Hale is more believable?"]},

e_h_book:{act:4, ending:true, title:"The Road to Boston", seal:"Ending: you went for help",
 body:s=>[
  "You ride all night. In Boston you go from minister to minister and tell them what you saw: the yellow bird, the girls repeating Mary’s words, a court that hangs people because someone dreamed of their spirit.",
  "Proctor still hangs. Letters move too slowly to save him. But by the end of October the governor shuts the court down, and the people still in jail live.",
  "Years later you write it all down in a book, so the next village will know better."
 ],
 record:"Pressure from Boston really did stop the court. In October 1692, Increase Mather argued that it was better for guilty people to go free than for one innocent person to die. Governor Phips stopped the use of spectral evidence and closed the court. When a new court heard the remaining cases in 1693, nearly everyone was found not guilty, and the few convicted were pardoned.",
 questions:["Hale changes his mind too late to save Proctor. Does that make it worthless?","What finally stopped the trials? What does that say about who has the power to end a panic?"]}
});

/* ---------- scene art: which picture goes with which scene ---------- */
const ENDART={e_name:"ledge",e_live:"village",e_broken:"village",e_silent:"farm",e_flight:"road",e_early:"village",
  e_m_truth:"jail",e_m_jailturn:"court",e_m_late:"ledge",e_m_accuser:"village",
  e_h_inside:"court",e_h_counsel:"ledge",e_h_witness:"ledge",e_h_book:"road"};
const BIRD=new Set(["a3_bird","h3_court","m3_court"]);
function artType(id,sc){
  if(ENDART[id]) return ENDART[id];
  const p=sc.place||"";
  if(p.includes("Parris")) return "parris";
  if(p.includes("farm")) return "farm";
  if(p.includes("meetinghouse")) return "court";
  if(p.includes("jail")) return "jail";
  if(p.includes("road")) return "road";
  return "village";
}

/* ---------- things to examine in each picture ---------- */
const HS={
 parris:[
  {x:.27,y:.66,t:"Betty’s bed",d:"The village doctor, William Griggs, examined the girls and reportedly said they were under an “evil hand.” A doctor’s word turned an illness nobody understood into a crime."},
  {x:.6,y:.6,t:"The books",d:"Books about witchcraft were widely read. Cotton Mather’s Memorable Providences (1689) described Boston children whose fits looked a lot like Betty’s. Educated people in Massachusetts knew the story well."},
  {x:.745,y:.35,t:"The window",d:"In February 1692, a neighbor named Mary Sibley had Tituba and her husband, John Indian, bake a “witch cake” using the girls’ urine and feed it to a dog. It was an English folk test for witchcraft. Parris scolded Sibley in church, and the first accusations came soon after."}],
 farm:[
  {x:.21,y:.62,t:"The lit window",d:"Elizabeth Proctor’s grandmother, Ann Burt, had been accused of witchcraft years earlier. Old rumors like that followed families and made them easier targets in 1692."},
  {x:.62,y:.8,t:"The fields",d:"The real John Proctor leased a large farm south of Salem Village and kept a tavern on the road to Ipswich. He was a prosperous, outspoken man of about sixty."}],
 court:[
  {x:.3,y:.1,t:"The rafters",d:"Spectral evidence was testimony that a person’s spirit, or specter, had attacked someone. Only the afflicted could see it, so the accused had no way to prove where their spirit had been."},
  {x:.12,y:.84,t:"The girls’ bench",d:"The afflicted girls sat up front. When an accused person bit their lip or moved their hands, the girls cried out in pain or copied the movement, and the judges treated that as proof."},
  {x:.5,y:.54,t:"The judges’ table",d:"In the touch test, an accused person touched a girl having a fit. If the fit stopped, the court said the evil power had flowed back into the witch."}],
 jail:[
  {x:.2,y:.5,t:"The chains",d:"Accused witches were chained because people believed it kept their spirits from escaping to attack the girls. Prisoners or their families had to pay for food, lodging, and even the chains."},
  {x:.5,y:.17,t:"The window",d:"Sarah Good gave birth in jail, and her baby died there. Her daughter Dorothy, about four years old, was accused too and spent months in chains."}],
 road:[
  {x:.42,y:.86,t:"The road",d:"The panic spread far beyond Salem Village. People from more than twenty towns were accused, and Andover had more accused people than any other town."},
  {x:.56,y:.54,t:"Toward Boston",d:"Many accused people were held in the Boston jail, where conditions were terrible. Sarah Osburn died there in May 1692, still waiting for a trial."}],
 ledge:[
  {x:.66,y:.44,t:"The ledge",d:"For centuries no one knew exactly where the hangings happened. In 2016, researchers confirmed a spot called Proctor’s Ledge, and a memorial was dedicated there in 2017."},
  {x:.3,y:.9,t:"The crowd",d:"Executions were public, and the hanged were not buried in church ground. Rebecca Nurse’s family is said to have secretly recovered her body at night and buried it on the family farm."}],
 village:[

  {x:.14,y:.68,t:"The houses",d:"Salem Village, now the town of Danvers, was a farming community. It was separate from Salem Town, a busy port whose merchants many villagers resented."}]
};

/* ---------- canvas painter ---------- */
const Art=(()=>{
  let cv=null,c=null,w=0,h=0,type="village",bird=false,fear=.3,raf=0,px=0,tpx=0,seed=7;
  let reduce=false;try{reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
  const T0=performance.now();
  function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function resize(){if(!cv||!cv.isConnected)return;const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);w=r.width;h=r.height;cv.width=Math.max(1,Math.round(w*d));cv.height=Math.max(1,Math.round(h*d));c.setTransform(d,0,0,d,0,0);if(reduce)draw(0);}
  function show(el,t,o){cancelAnimationFrame(raf);cv=el;c=cv.getContext("2d");type=t;bird=!!(o&&o.bird);if(o&&o.fear!=null)fear=o.fear;seed=[...t].reduce((a,ch)=>(a*31+ch.charCodeAt(0))|0,7);resize();if(reduce)draw(0);else raf=requestAnimationFrame(loop);}
  function loop(now){if(!cv||!cv.isConnected)return;raf=requestAnimationFrame(loop);px+=(tpx-px)*.05;draw((now-T0)/1000);}
  window.addEventListener("pointermove",e=>{tpx=(e.clientX/window.innerWidth-.5)*2;});
  window.addEventListener("resize",resize);

  const L=(y0,y1,st)=>{const g=c.createLinearGradient(0,y0,0,y1);st.forEach(s=>g.addColorStop(s[0],s[1]));return g;};
  function glow(x,y,r,rgb,a){if(r<=0)return;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${rgb},${a})`);g.addColorStop(1,`rgba(${rgb},0)`);c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);}
  function stars(n,t,maxY){const r=rng(seed);for(let i=0;i<n;i++){const x=r()*w+px*3,y=r()*h*maxY,s=r()*1.3+.4,ph=r()*6;const a=.2+.45*(.5+.5*Math.sin(t*1.5+ph));c.fillStyle=`rgba(236,224,191,${a.toFixed(3)})`;c.fillRect(x,y,s,s);}}
  function moon(x,y,R){glow(x,y,R*5,"200,210,230",.18);c.fillStyle="#e7e0c6";c.beginPath();c.arc(x,y,R,0,7);c.fill();c.fillStyle="rgba(0,0,0,.08)";c.beginPath();c.arc(x-R*.3,y-R*.2,R*.25,0,7);c.fill();}
  function ridge(base,amp,col,depth,f,ph){const o=px*depth*22;c.fillStyle=col;c.beginPath();c.moveTo(-50,h);for(let x=-50;x<=w+50;x+=6){const u=(x-o)/w;c.lineTo(x,base*h-amp*h*(Math.sin(u*f*6+ph)*.6+Math.sin(u*f*15+ph*2)*.25+.4));}c.lineTo(w+50,h);c.closePath();c.fill();}
  function fog(t,y,a,rgb){rgb=rgb||"170,180,195";for(let i=0;i<6;i++){const x=((i*w*.37+t*(8+i*3))%(w*1.6))-w*.3;c.save();c.translate(x,y*h+Math.sin(t*.3+i)*h*.02);c.scale(3,1);const r=h*.22;const g=c.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,`rgba(${rgb},${a})`);g.addColorStop(1,`rgba(${rgb},0)`);c.fillStyle=g;c.fillRect(-r,-r,r*2,r*2);c.restore();}}
  function lattice(x,y,ww,hh,step){c.save();c.beginPath();c.rect(x,y,ww,hh);c.clip();c.strokeStyle="rgba(10,8,6,.85)";c.lineWidth=1.2;for(let k=-hh;k<ww+hh;k+=step){c.beginPath();c.moveTo(x+k,y);c.lineTo(x+k+hh,y+hh);c.stroke();c.beginPath();c.moveTo(x+k,y+hh);c.lineTo(x+k+hh,y);c.stroke();}c.restore();c.lineWidth=Math.max(3,ww*.04);c.strokeStyle="#0a0806";c.strokeRect(x,y,ww,hh);}
  function flame(x,y,s,t){const f=1+.12*Math.sin(t*11)+.08*Math.sin(t*27+1);glow(x,y,s*14*f,"255,170,80",.16+.04*f);c.fillStyle="#ffd28a";c.beginPath();c.ellipse(x,y,s*.45,s*1.2*f,0,0,7);c.fill();c.fillStyle="#fff2cf";c.beginPath();c.ellipse(x,y+s*.3,s*.2,s*.5,0,0,7);c.fill();}
  function person(x,base,s,hat,col,coif){
    c.fillStyle=col;c.beginPath();c.moveTo(x-s*1.1,base);c.quadraticCurveTo(x-s,base-s*1.1,x,base-s*1.15);c.quadraticCurveTo(x+s,base-s*1.1,x+s*1.1,base);c.closePath();c.fill();
    c.beginPath();c.arc(x,base-s*1.55,s*.45,0,7);c.fill();
    if(hat==="brim"){c.beginPath();c.ellipse(x,base-s*1.85,s*.8,s*.12,0,0,7);c.fill();c.fillRect(x-s*.38,base-s*2.3,s*.76,s*.45);}
    if(hat==="tall"){c.beginPath();c.ellipse(x,base-s*1.85,s*.7,s*.1,0,0,7);c.fill();c.beginPath();c.moveTo(x-s*.4,base-s*1.85);c.lineTo(x-s*.3,base-s*2.6);c.lineTo(x+s*.3,base-s*2.6);c.lineTo(x+s*.4,base-s*1.85);c.closePath();c.fill();}
    if(coif){c.fillStyle=coif;c.beginPath();c.arc(x,base-s*1.6,s*.52,Math.PI*1.02,Math.PI*1.98);c.lineTo(x+s*.52,base-s*1.4);c.lineTo(x-s*.52,base-s*1.4);c.closePath();c.fill();}
  }
  function tree(x,y,len,a,d,r,t){if(d===0)return;const sw=Math.sin(t*.7+d)*.015*(7-d);const x2=x+Math.cos(a+sw)*len,y2=y+Math.sin(a+sw)*len;c.lineWidth=Math.max(1,d*1.2);c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.stroke();tree(x2,y2,len*.72,a-.3-r()*.35,d-1,r,t);tree(x2,y2,len*.72,a+.28+r()*.35,d-1,r,t);}

  const scenes={
  parris(t){
    c.fillStyle=L(0,h,[[0,"#211a14"],[1,"#140f0b"]]);c.fillRect(0,0,w,h);
    c.strokeStyle="rgba(0,0,0,.35)";c.lineWidth=1;for(let x=0;x<w+20;x+=w/16){c.beginPath();c.moveTo(x+px*2,0);c.lineTo(x+px*2,h*.8);c.stroke();}
    c.fillStyle="#0c0907";c.fillRect(0,0,w,h*.06);
    const wx=w*.66+px*3,wy=h*.14,ww=w*.17,wh=h*.42;
    c.save();c.beginPath();c.rect(wx,wy,ww,wh);c.clip();c.fillStyle=L(wy,wy+wh,[[0,"#0d1a2c"],[1,"#24364d"]]);c.fillRect(wx,wy,ww,wh);moon(wx+ww*.68,wy+wh*.3,Math.min(ww,wh)*.11);c.restore();
    lattice(wx,wy,ww,wh,ww/4);
    c.fillStyle="rgba(170,190,225,.055)";c.beginPath();c.moveTo(wx,wy+wh);c.lineTo(wx+ww,wy+wh);c.lineTo(wx+ww*.4,h);c.lineTo(wx-ww*1.1,h);c.closePath();c.fill();
    c.fillStyle="#0f0c09";c.fillRect(0,h*.8,w,h*.2);
    const o=px*8,x0=w*.06+o,x1=w*.44+o;
    c.fillStyle="#090706";c.fillRect(x0,h*.4,w*.014,h*.46);c.fillRect(x1-w*.014,h*.5,w*.014,h*.36);c.fillRect(x0,h*.7,x1-x0,h*.08);
    c.fillStyle="#3b3127";c.beginPath();c.ellipse(x0+w*.06,h*.64,w*.045,h*.04,0,0,7);c.fill();
    c.fillStyle="#2a1e14";c.beginPath();c.arc(x0+w*.07,h*.62,h*.035,0,7);c.fill();
    const br=Math.sin(t*1.2)*h*.004;
    c.fillStyle="#3a2a1c";c.beginPath();c.moveTo(x0+w*.012,h*.71);c.bezierCurveTo(x0+w*.1,h*.6-br,x0+w*.25,h*.6-br,x1-w*.014,h*.66);c.lineTo(x1-w*.014,h*.71);c.closePath();c.fill();
    const tx=w*.56+px*6;
    c.fillStyle="#0b0806";c.fillRect(tx-w*.07,h*.66,w*.14,h*.025);c.fillRect(tx-w*.06,h*.68,w*.01,h*.14);c.fillRect(tx+w*.05,h*.68,w*.01,h*.14);
    ["#4a1f18","#2b2a1c","#3b2414"].forEach((col,i)=>{c.fillStyle=col;c.fillRect(tx+w*.005-i*w*.004,h*.66-(i+1)*h*.028,w*.055-i*w*.006,h*.026);});
    c.fillStyle="#d8ceb0";c.fillRect(tx-w*.035,h*.58,w*.008,h*.08);
    flame(tx-w*.031,h*.565,h*.018,t);
  },
  farm(t){
    c.fillStyle=L(0,h,[[0,"#08101d"],[.65,"#1b2738"],[1,"#1b2738"]]);c.fillRect(0,0,w,h);
    stars(80,t,.55);moon(w*.82+px*4,h*.2,h*.06);
    ridge(.6,.07,"#111925",.15,1.2,1);
    c.fillStyle="#0e120d";c.fillRect(0,h*.64,w,h*.36);
    c.strokeStyle="rgba(0,0,0,.45)";c.lineWidth=1;const vx=w*.62+px*10;for(let i=-10;i<=10;i++){c.beginPath();c.moveTo(vx,h*.64);c.lineTo(vx+i*w*.12,h);c.stroke();}
    const x0=w*.16+px*12,wd=w*.3,b=h*.72,wh=h*.17;
    c.fillStyle="#06080b";c.beginPath();c.moveTo(x0,b);c.lineTo(x0,b-wh);c.lineTo(x0+wd*.38,b-wh-h*.15);c.lineTo(x0+wd,b-h*.05);c.lineTo(x0+wd,b);c.closePath();c.fill();
    c.fillRect(x0+wd*.4,b-wh-h*.2,wd*.07,h*.1);
    const f=.75+.15*Math.sin(t*5)+.08*Math.sin(t*13);
    c.fillStyle=`rgba(240,170,80,${f.toFixed(3)})`;c.fillRect(x0+wd*.12,b-wh*.72,wd*.08,h*.06);
