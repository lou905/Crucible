  "The meetinghouse is packed to the walls. People have walked in from three towns to watch. The girls sit on the front bench, and with them now is Mary Warren, the Proctors’ servant, who has never been noticed in her life.",
  "Old Sarah Good is brought in, ragged and angry. When she looks at the bench, the girls scream and twist. The magistrate does not ask whether she hurt them. He asks her why she does it.",
  s.f.tookList ? "Thomas Putnam catches your eye and nods. Several names from his list have been read out this week." : "",
  "Then a name is spoken that silences the room: Rebecca Nurse."
 ],
 choices:[
  {t:"Ask the magistrate to let Sarah Good answer before the girls do.", fx:{name:-5,con:10,fear:-5}, set:"spokeCourt", go:"h2_proctor"},
  {t:"Write down the girls’ testimony carefully. This is what you came here for.", fx:{name:5,con:-5,fear:10}, go:"h2_proctor"}
 ],
 record:{play:"Miller does not show the early examinations onstage. Mary describes them to the Proctors in Act II, including Sarah Good’s case.",
  history:"The records show that magistrate John Hathorne asked Sarah Good why she hurt the children, not whether she did. Sarah Good was hanged on July 19, 1692. Her daughter Dorothy, only about four years old, was jailed too."}},

h3_warrants:{act:3, place:"The meetinghouse, Salem", when:"Before court opens", title:"Seventy-Two Names",
 body:s=>[
  "Before court opens, Deputy Governor Danforth sets a stack of papers in front of you. They are death warrants. The court has condemned these people, and your signature as a minister will show the colony that the church agrees.",
  "You have signed papers like these before. Seventy-two of them. You told yourself every one was proven.",
  s.f.spokeCourt ? "Danforth mentions, lightly, that some people say you have gone soft since Sarah Good’s examination." : "",
  "Rebecca Nurse’s warrant is near the top of the stack."
 ],
 choices:[
  {t:"Sign. The court has ruled, and it is not your place to overturn it.", fx:{name:10,con:-15,fear:10}, set:"signedNurse", go:"h3_court"},
  {t:"Refuse to sign Rebecca’s. Tell Danforth you must see the evidence for yourself.", fx:{name:-10,con:10}, go:"h3_court"}
 ],
 record:{play:"In Act III, Hale tells Danforth he has signed seventy-two death warrants and will not sign another without solid proof.",
  history:"In reality, ministers did not sign death warrants. Chief Judge William Stoughton signed them. But ministers did advise the court. In June 1692, a group of ministers warned the judges to be careful with spectral evidence, and in the same letter urged them to keep the trials going."}},

h4_parris:{act:4, place:"Salem jail", when:"Autumn 1692, night", title:"Parris",
 body:s=>[
  "Reverend Parris finds you in the jail yard after dark. His hands are shaking. Abigail is gone, he says. She and Mercy Lewis slipped away in the night, and his money box went with them.",
  "Worse, the people of Andover have turned against the court, and someone here left a dagger stuck in his door. If John Proctor and Rebecca Nurse hang tomorrow, he is afraid the whole village will rise against him.",
  "He wants you to come with him and beg Danforth to delay the hangings, just until Proctor confesses.",
  s.f.signedNurse ? "Rebecca Nurse’s warrant still has your name on it. You think about it every night." : ""
 ],
 choices:[
  {t:"Go with Parris to Danforth and ask for a delay.", fx:{con:5,fear:-5}, set:"askedDelay", go:"h4_jail"},
  {t:"Tell Parris he is only afraid for himself, and leave him in the yard.", fx:{name:-5,con:5}, go:"h4_jail"}
 ],
 record:{play:"In Act IV, Parris reports that Abigail stole his money and ran away, and that he found a dagger in his door. He begs Danforth to postpone the hangings.",
  history:"The real Samuel Parris stayed in Salem Village for several more years. Families who had lost relatives in the trials pushed to remove him, and he finally left around 1697 after a long fight over his pay and his house."}}

function artType(id,sc){
  if(ENDART[id]) return ENDART[id];
  const p=sc.place||"";
  if(p.includes("Parris")) return "parris";
  if(p.includes("farm")) return "farm";
  if(p.includes("meetinghouse")) return "court";
  if(p.includes("jail")) return "jail";
  if(p.includes("road")) return "road";
  return "village";
}

/* ---------- literary terms ---------- */
const TERMS={
 "Dramatic irony":"When the audience knows something a character does not.",
 "Situational irony":"When what happens is the opposite of what you would expect.",
 "Foreshadowing":"A hint early in the story about something that will happen later.",
 "Tragic flaw":"A weakness in an otherwise good main character that leads to his downfall. It is also called hamartia.",
 "Tragic hero":"A good but flawed main character who falls because of his own choices and comes to understand himself before the end.",
 "Symbol":"An object, person, or event that stands for a bigger idea.",
 "Motif":"An image or idea that keeps coming back and helps build a theme.",
 "Internal conflict":"A struggle inside a character’s own mind, between two things they want or believe.",
 "External conflict":"A struggle between a character and an outside force, such as another person or society.",
 "Foil":"A character whose differences from another character make that character’s traits stand out.",
 "Dynamic character":"A character who changes in an important way over the story.",
 "Climax":"The turning point of the story, where the main conflict reaches its highest tension.",
 "Characterization":"How a writer shows what a character is like, through their words, actions, and how others react to them.",
 "Theme":"A central message or insight about life that the story explores.",
 "Allegory":"A story with a second meaning beneath the surface, where characters and events stand for real people, events, or ideas.",
 "Catharsis":"The release of strong emotion, like pity or fear, that an audience feels at the end of a tragedy.",
 "Antagonist":"The character or force that works against the main character."
};

/* ---------- lock: stop when the next scene is past the act the class has read ---------- */
function lockedScreen(sc){
  const C=CHARS[st.c];
  const pathText=st.log.map((l,i)=>`${i+1}. Act ${ACTS[l.act-1]}, ${l.scene}: ${l.choice}`).join("\n");
  const copyText=`Proctor’s Name, played as ${C.name} (stopped at end of Act ${ACTS[CFG.lock-1]})\nName ${st.name} · Conscience ${st.con} · Salem’s Fear ${st.fear}\n\nMy choices:\n${pathText}`;
  stage.innerHTML=`<section class="scene ending">
    ${artBlock("village")}
    <div class="seal" style="color:var(--ember)">Stop here for now</div>
    <h1>The rest of the story is locked</h1>
    <div class="prose"><p>Your class has read through Act ${ACTS[CFG.lock-1]}. The next scene happens in Act ${ACTS[sc.act-1]}, so your teacher has paused the game here. Once your class reads further, your teacher will open more of the story.</p>
    <p>Before you go, look at your meters. What do you predict will happen next?</p></div>
    <div class="block path"><h2>Your path so far</h2><ol>${st.log.map(l=>`<li><span>Act ${ACTS[l.act-1]}</span>${esc(l.choice)}</li>`).join("")}</ol></div>
    <div class="row">
      <button class="btn" id="copy" type="button">Copy my path</button>
      <button class="btn ghost" id="other" type="button">Back to the title</button>
    </div>
    <p class="note" id="copynote"></p>
    <textarea id="copybox" readonly hidden>${esc(copyText)}</textarea>
  </section>`;
  mountArt("village",{});
  $("other").onclick=title;
  wireCopy(copyText);
}
function wireCopy(copyText){
  $("copy").onclick=()=>{
    const box=$("copybox");
    const fallback=()=>{box.hidden=false;box.focus();box.select();$("copynote").textContent="Select all and copy the text below.";};
    try{navigator.clipboard.writeText(copyText).then(()=>{$("copynote").textContent="Copied. Paste it into your assignment.";},fallback);}catch(e){fallback();}
  };
}

/* ---------- evidence gate: choices unlock after every mark is examined ---------- */
function gateChoices(){
  const marks=[...stage.querySelectorAll(".hs")], btns=[...stage.querySelectorAll(".choice")], gate=$("gate"), seen=new Set();
  const update=()=>{
    const left=marks.length-seen.size;
    btns.forEach(b=>{b.disabled=left>0;});
    if(left>0){gate.className="gate";gate.innerHTML=`Examine every glowing mark in the picture to unlock your choices. <b>${seen.size} of ${marks.length}</b> examined.`;}
    else{gate.className="gate done";gate.textContent=`All ${marks.length} examined. Your choices are open.`;}
  };
  marks.forEach((m,i)=>m.addEventListener("click",()=>{seen.add(i);update();}));
  update();
}

/* ---------- teacher mode ---------- */
function cfgNote(){
  const bits=[];
  if(CFG.lock) bits.push(`Acts ${CFG.lock===1?"I":"I–"+ACTS[CFG.lock-1]} only`);
  if(CFG.mc) bits.push("1953 notes on");
  if(!CFG.vocab) bits.push("vocabulary off");
  if(!CFG.lit) bits.push("literary lens off");
  if(!CFG.ev) bits.push("evidence optional");
  return bits.length?`<p class="tcfg">Your teacher’s settings: ${bits.join(" · ")}</p>`:"";
}
function teacherPanel(){
  const el=$("tpanel"); if(!el) return;
  if(!el.hidden){el.hidden=true;return;}
  el.hidden=false;
  el.innerHTML=`<h2>Teacher mode</h2>
   <p>Choose settings, then copy the link and post it in Canvas. Students who open that link get these settings.</p>
   <label>Open the story through
     <select id="t-act"><option value="1">Act I</option><option value="2">Act II</option><option value="3">Act III</option><option value="0">All four acts</option></select></label>
   <label class="tick"><input type="checkbox" id="t-mc"> Add the 1953 layer (McCarthyism and the Red Scare) to every Court Record</label>
   <label class="tick"><input type="checkbox" id="t-vocab"> Vocabulary pop-ups</label>
   <label class="tick"><input type="checkbox" id="t-lit"> Literary lens (literary terms in each scene)</label>
   <label class="tick"><input type="checkbox" id="t-ev"> Students must examine every glowing mark before they can choose</label>
   <div class="row" style="margin-top:6px"><button class="btn" id="t-copy" type="button">Copy student link</button><button class="btn ghost" id="t-try" type="button">Try these settings</button></div>
   <input id="t-link" class="tlinkbox" readonly aria-label="Student link">
   <p class="note" id="t-note"></p>
   <p class="small">The lock keeps students from reading ahead by accident. A student who edits the link could get around it, so treat it as a guardrail, not a security measure.</p>`;
  $("t-act").value=String(CFG.lock); $("t-mc").checked=CFG.mc; $("t-vocab").checked=CFG.vocab; $("t-lit").checked=CFG.lit; $("t-ev").checked=CFG.ev;
  const build=()=>{const q=new URLSearchParams();const a=$("t-act").value;if(a!=="0")q.set("act",a);if($("t-mc").checked)q.set("mc","1");if(!$("t-vocab").checked)q.set("vocab","0");if(!$("t-lit").checked)q.set("lit","0");if(!$("t-ev").checked)q.set("ev","0");
    const base=location.href.split(/[?#]/)[0];const s=q.toString();return base+(s?"?"+s:"");};
  const upd=()=>{$("t-link").value=build();};
  el.querySelectorAll("select,input[type=checkbox]").forEach(x=>x.onchange=upd); upd();
  $("t-copy").onclick=()=>{const v=build(),box=$("t-link");
    const fb=()=>{box.focus();box.select();$("t-note").textContent="Select the link above and copy it.";};
    try{navigator.clipboard.writeText(v).then(()=>{$("t-note").textContent="Link copied. Paste it into Canvas.";},fb);}catch(e){fb();}};
  $("t-try").onclick=()=>{location.href=build();};
  el.scrollIntoView({behavior:"smooth",block:"start"});
}
document.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest(".vw"); if(b){e.preventDefault();vocabPop(+b.dataset.v,b);return;}
  const p=$("vpop"); if(p&&!p.hidden&&!e.target.closest("#vpop")) p.hidden=true;
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const p=$("vpop");if(p)p.hidden=true;}});

/* ---------- state ---------- */
let st;
function fresh(c){const C=CHARS[c];return {c,id:C.start,name:C.m[0],con:C.m[1],fear:C.m[2],f:{},log:[]};}
const clamp=v=>Math.max(0,Math.min(100,v));
function foundSet(){try{return new Set(JSON.parse(localStorage.getItem("proctor-endings")||"[]"));}catch(e){return new Set();}}
function saveFound(id){try{const s=foundSet();s.add(id);localStorage.setItem("proctor-endings",JSON.stringify([...s]));}catch(e){}}

const $=id=>document.getElementById(id);
const stage=$("stage");
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function hud(sc){
  $("hud").hidden=false;
  $("acts").innerHTML=ACTS.map((a,i)=>`<span class="${i+1===sc.act?'on':(i+1<sc.act?'done':'')}${CFG.lock&&i+1>CFG.lock?' lock':''}"${CFG.lock&&i+1>CFG.lock?' title="Locked by your teacher"':''}>Act ${a}</span>`).join("");
  [["name","name"],["con","con"],["fear","fear"]].forEach(([k])=>{$("v-"+k).textContent=st[k];$("b-"+k).style.width=st[k]+"%";});
  document.documentElement.style.setProperty("--fear",(st.fear/100).toFixed(2));
  Art.setFear(st.fear/100); Sound.setFear(st.fear/100); syncSnd();
}
function flash(fx){
  for(const k of ["name","con","fear"]){
    const d=$("d-"+k); const v=fx&&fx[k];
    if(!v){d.className="delta";d.textContent="";continue;}
    d.textContent=(v>0?"+":"")+v; d.className="delta show "+(v>0?"up":"down");
    setTimeout(()=>d.classList.remove("show"),2200);
  }
}

function title(){
  $("hud").hidden=true;
  document.documentElement.style.setProperty("--fear","0.15");
  const f=foundSet();
  const total=Object.values(CHARS).reduce((n,c)=>n+c.ends.length,0);
  const got=Object.values(CHARS).reduce((n,c)=>n+c.ends.filter(e=>f.has(e)).length,0);
  stage.innerHTML=`<section class="title-card scene">
    ${artBlock("village")}
    <div class="row" style="justify-content:space-between;align-items:center"><div class="kicker">A choose-your-path game · The Crucible</div><button class="snd" id="titlesnd" type="button" aria-pressed="false">Music off</button></div>
    <h1>Proctor’s Name</h1>
    <p class="sub">Salem Village, 1692</p>
    <div class="prose">
      <p>Something is wrong with the minister’s daughter, and before long the whole village will be looking for someone to blame. Choose who you will be.</p>
      <p>Some paths follow Arthur Miller’s play. Others go where the play never goes. Under every scene is a <em>Court Record</em> showing how the play compares to what really happened in 1692.</p>
    </div>
    <div class="cast">${Object.entries(CHARS).map(([k,c])=>`<button class="pick" type="button" data-c="${k}">
      ${c.svg}<span class="role">${c.role}</span><span class="who">${c.name}</span><span class="blurb">${esc(c.blurb)}</span>
      <span class="count">${c.ends.filter(e=>f.has(e)).length} of ${c.ends.length} endings found</span></button>`).join("")}</div>
    <dl class="legend">
      <div><dt style="color:var(--ember)">Name</dt><dd>What Salem thinks of you.</dd></div>
      <div><dt style="color:var(--moss)">Conscience</dt><dd>What you think of yourself.</dd></div>
      <div><dt style="color:var(--blood)">Salem’s Fear</dt><dd>How far the panic has spread.</dd></div>
    </dl>
    <p class="found">Every path covers all four acts. You have found ${got} of ${total} endings.</p>
    ${CFG.vocab?'<p class="found">Words with a dotted underline are clickable. Tap one to see what it meant in 1692.</p>':''}
    ${cfgNote()}
    <p class="found">Music: “Old Hundredth,” a psalm tune from 1551 that Puritan congregations sang. When Salem’s Fear passes the halfway mark, the tune turns to a minor key and a drum comes in.</p>
    <button class="tlink" id="tbtn" type="button">For teachers: lock acts and add the 1953 layer</button>
    <div id="tpanel" hidden></div>
  </section>`;
  mountArt("village",{fear:.15});
  $("titlesnd").onclick=toggleSnd; syncSnd();
  $("tbtn").onclick=teacherPanel;
  stage.querySelectorAll(".pick").forEach(b=>b.onclick=()=>{st=fresh(b.dataset.c);lastAct=0;if(soundPref())Sound.start();go(st.id);});
}

function go(id){
  if(S[id]&&S[id].alias) id=S[id].alias;
  st.id=id; const sc=S[id];
  window.scrollTo({top:0,behavior:"smooth"});
  hud(sc);
  if(CFG.lock&&sc.act>CFG.lock){return lockedScreen(sc);}
  if(sc.act!==lastAct){lastAct=sc.act;Sound.bell();}
  vSeen=new Set(); $("vpop").hidden=true;
  if(sc.ending){return ending(id,sc);}
  const chs=sc.choices;
  const paras=sc.body(st).filter(Boolean);
  const type=artType(id,sc);
  stage.innerHTML=`<section class="scene">
    ${artBlock(type)}
    <div class="docket"><span>Act ${ACTS[sc.act-1]}</span><span>${esc(sc.place)}</span><span>${esc(sc.when)}</span></div>
    <h1>${esc(sc.title)}</h1>
    <div class="prose">${paras.map((p,i)=>`<p style="--i:${i}">${deco(esc(p))}</p>`).join("")}</div>
    ${CFG.ev&&(HS[type]||[]).length?`<p class="gate" id="gate" role="status"></p>`:""}
    <div class="choices">${chs.map((c,i)=>`<button class="choice" type="button" style="--d:${(paras.length*.22+.15+i*.08).toFixed(2)}" data-i="${i}" data-k="${"ABC"[i]}">${esc(c.t)}</button>`).join("")}</div>
    ${litBlock(id)}
    <details class="record"><summary>Court Record: the play${CFG.mc&&MC[id]?", 1692, and 1953":" and 1692"}</summary>
      <div class="cols"><div class="col"><h3>In the play</h3><p>${deco(esc(sc.record.play))}</p></div>
      <div class="col"><h3>In 1692</h3><p>${deco(esc(sc.record.history))}</p></div></div>
      ${CFG.mc&&MC[id]?`<div class="y1953"><h3>In 1953: why Miller wrote it</h3><p>${deco(esc(MC[id]))}</p></div>`:""}
    </details>
  </section>`;
  mountArt(type,{bird:BIRD.has(id)}); mountLit(id);
  if(CFG.ev&&(HS[type]||[]).length) gateChoices();
  stage.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    Sound.quill();
    const c=chs[+b.dataset.i]; const fx=c.fx||{};
    st.name=clamp(st.name+(fx.name||0)); st.con=clamp(st.con+(fx.con||0)); st.fear=clamp(st.fear+(fx.fear||0));
    if(c.set) st.f[c.set]=true;
    st.log.push({act:sc.act,scene:sc.title,choice:c.t});
    go(c.go); flash(fx);
  });
}

function verdict(){
  const n=st.name,c=st.con,fe=st.fear;
  if(c>=70&&n<40) return "Salem thinks little of you. You think better of yourself than you have in years.";
  if(c>=70) return "You kept faith with yourself, and somehow the village still respects you.";
  if(c<35&&n>=50) return "Your neighbors still think well of you. You know better.";
  if(c<35) return "You lost the village’s respect and your own along the way.";
  if(fe>=60) return "You survived the year, but the fear in Salem only grew around you.";
  return "You made the choices most people would have made. Whether that is good enough is the question the play keeps asking.";
}

function ending(id,sc){
  saveFound(id);
  const f=foundSet(); const C=CHARS[st.c];
  const pathText=st.log.map((l,i)=>`${i+1}. Act ${ACTS[l.act-1]}, ${l.scene}: ${l.choice}`).join("\n");
  const copyText=`Proctor’s Name, played as ${C.name}: ${sc.title}\nName ${st.name} · Conscience ${st.con} · Salem’s Fear ${st.fear}\n\nMy choices:\n${pathText}`;
  const type=artType(id,sc);
  if(type==="ledge") Sound.toll();
  stage.innerHTML=`<section class="scene ending">
    ${artBlock(type)}
    <div class="seal">${esc(sc.seal)}</div>
    <h1>${esc(sc.title)}</h1>
    <div class="prose">${sc.body(st).filter(Boolean).map(p=>`<p>${deco(esc(p))}</p>`).join("")}</div>
    <div class="verdict">${esc(verdict())}</div>
    ${litBlock(id)}
    <div class="block after"><h2>What really happened</h2><p>${deco(esc(sc.record))}</p>
      ${CFG.mc&&MC[id]?`<div class="y1953"><h3>In 1953: why Miller wrote it</h3><p>${deco(esc(MC[id]))}</p></div>`:""}
      <p>Afterward: in 1711 the colony reversed the convictions of John Proctor and others and paid their families. The Proctor heirs received £150. Massachusetts cleared more names in 1957 and 2001, and the last person convicted, Elizabeth Johnson Jr., was cleared in 2022. In 2016, researchers confirmed Proctor’s Ledge in Salem as the place where the hangings happened.</p></div>
    <div class="block"><h2>Talk about it</h2><ol>${sc.questions.map(q=>`<li>${esc(q)}</li>`).join("")}<li>Miller wrote this play in 1953 about the Red Scare, when Americans were accused of being Communists. Which of your choices would have played out the same way in 1953? In a school today?</li></ol></div>
    <div class="block path"><h2>Your path</h2><ol>${st.log.map(l=>`<li><span>Act ${ACTS[l.act-1]}</span>${esc(l.choice)}</li>`).join("")}</ol></div>
    <p class="found">${C.name}: ${C.ends.filter(e=>f.has(e)).length} of ${C.ends.length} endings found.</p>
    <div class="row">
      <button class="btn" id="again" type="button">Play again as ${C.name}</button>
      <button class="btn ghost" id="other" type="button">Choose another character</button>
      <button class="btn ghost" id="copy" type="button">Copy my path</button>
    </div>
    <p class="note" id="copynote"></p>
    <textarea id="copybox" readonly hidden>${esc(copyText)}</textarea>
  </section>`;
  mountArt(type,{}); mountLit(id);
  $("again").onclick=()=>{st=fresh(st.c);lastAct=0;go(st.id);};
  $("other").onclick=title;
  $("copy").onclick=()=>{
    const box=$("copybox");
    const fallback=()=>{box.hidden=false;box.focus();box.select();$("copynote").textContent="Select all and copy the text below.";};
    try{navigator.clipboard.writeText(copyText).then(()=>{$("copynote").textContent="Copied. Paste it into your assignment.";},fallback);}catch(e){fallback();}
  };
}

$("home").onclick=title;
$("hudsnd").onclick=toggleSnd;
title();
</script>
